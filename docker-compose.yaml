services:
  reverse-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
      - ./certs:/app/certs:ro
      - ./test:/app/test:ro
      - ./configs:/app/configs:ro  # JSON 설정 파일 마운트
    environment:
      - PROXY_DOCKER_NETWORK=reverse-proxy-network
      - HTTP_PORT=80
      - PROXY_HTTPS_ENABLED=true
      - DOCKER_HOST=unix:///var/run/docker.sock
      - PROXY_VERBOSE=true
      - PROXY_TLS_CERT=/app/certs/cert.pem
      - PROXY_TLS_KEY=/app/certs/key.pem
      - PROXY_HTTPS_PORT=443
      - PROXY_LOG_LEVEL=debug
      - PROXY_LOG_FORMAT=text
      - PROXY_HEALTH_CHECK_ENABLED=true
      - PROXY_HEALTH_CHECK_INTERVAL=30
      - PROXY_RETRY_COUNT=3
      - PROXY_CONFIG_DIR=/app/configs  # JSON 설정 디렉토리 설정
    user: root
    restart: "no"
    networks:
      - reverse-proxy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "reverse-proxy"

  # API 서비스 (가중치 기반 로드밸런싱)
  api-1:
    image: nginx:alpine
    container_name: api-1
    expose:
      - "80"
    labels:
      # 기본 라우팅 설정만 라벨로 유지
      - "rproxy.http.routers.api.rule=Host(`test.localhost`) && PathPrefix(`/api`)"
      - "rproxy.http.routers.api.service=api-service"
      - "rproxy.http.routers.api.middlewares=api-cors"
      # JSON 설정 파일 경로 지정
      - "rproxy.config.json=/app/configs/api-service.json"
    networks:
      - reverse-proxy-network
    volumes:
      - ./test/api:/usr/share/nginx/html
      - ./nginx/api-1.conf:/etc/nginx/conf.d/default.conf

  api-2:
    image: nginx:alpine
    container_name: api-2
    expose:
      - "80"
    labels:
      # 기본 라우팅 설정만 라벨로 유지
      - "rproxy.http.routers.api.rule=Host(`test.localhost`) && PathPrefix(`/api`)"
      - "rproxy.http.routers.api.service=api-service"
      - "rproxy.http.routers.api.middlewares=api-cors"
      # JSON 설정 파일 경로 지정
      - "rproxy.config.json=/app/configs/api-service.json"
    networks:
      - reverse-proxy-network
    volumes:
      - ./test/api:/usr/share/nginx/html
      - ./nginx/api-2.conf:/etc/nginx/conf.d/default.conf

  # 웹 서비스 (라운드로빈 로드밸런싱)
  web-1:
    image: nginx:alpine
    container_name: web-1
    expose:
      - "80"
    labels:
      # 기본 라우팅 설정만 라벨로 유지
      - "rproxy.http.routers.web.rule=Host(`test.localhost`) && PathPrefix(`/web`)"
      - "rproxy.http.routers.web.service=web-service"
      - "rproxy.http.routers.web.middlewares=web-ratelimit"
      # JSON 설정 파일 경로 지정
      - "rproxy.config.json=/app/configs/web-service.json"
    networks:
      - reverse-proxy-network
    volumes:
      - ./test/web:/usr/share/nginx/html
      - ./nginx/web-1.conf:/etc/nginx/conf.d/default.conf

  web-2:
    image: nginx:alpine
    container_name: web-2
    expose:
      - "80"
    labels:
      # 기본 라우팅 설정만 라벨로 유지
      - "rproxy.http.routers.web.rule=Host(`test.localhost`) && PathPrefix(`/web`)"
      - "rproxy.http.routers.web.service=web-service"
      - "rproxy.http.routers.web.middlewares=web-ratelimit"
      # JSON 설정 파일 경로 지정
      - "rproxy.config.json=/app/configs/web-service.json"
    networks:
      - reverse-proxy-network
    volumes:
      - ./test/web:/usr/share/nginx/html
      - ./nginx/web-2.conf:/etc/nginx/conf.d/default.conf

# 테스트를 위한 네트워크 설정
networks:
  reverse-proxy-network:
    name: reverse-proxy-network

volumes:
  cargo-cache:
  target-cache: