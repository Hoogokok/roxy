[package]
name = "roxy-cli"
version = "0.1.0"
edition = "2021"
authors.workspace = true
description = "리버스 프록시 설정 관리 CLI 도구"

[[bin]]
name = "roxy-cli"
path = "src/main.rs"

[lib]
name = "roxy_cli"
path = "src/lib.rs"

[dependencies]
roxy = { path = "../roxy" }
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
console = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
bollard = "0.18.1"
serde_json = "1.0"
async-trait = "0.1"
futures-util = "0.3"
chrono = "0.4"
jsonschema = "0.17"

[dev-dependencies]
tempfile = "3.0"
assert_cmd = "2.0"
predicates = "3.0"
