[package]
name = "roxy-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "리버스 프록시 설정 관리 CLI 도구"

[[bin]]
name = "roxy-cli"
path = "src/main.rs"

[lib]
name = "roxy_cli"
path = "src/lib.rs"

[dependencies]
roxy = { path = "../roxy" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bollard = "0.18.1"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "fs"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "env-filter"] }
console = "0.15"
dialoguer = "0.11"
indicatif = "0.17"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3.2"
